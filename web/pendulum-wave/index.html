<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摆波星阵</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#e4f5ff;font:16px system-ui,sans-serif}header{padding:1.2rem 1.4rem}h1{font-size:1.4rem;margin:0}p{color:#a8bdd0;margin:.5rem 0}button{font:inherit;color:inherit;background:#13283b;border:1px solid #7298ac;border-radius:6px;padding:.4rem .9rem;cursor:pointer}button:focus-visible{outline:3px solid #ffe0a0;outline-offset:3px}canvas{display:block;width:min(100%,76svh,850px);aspect-ratio:1;margin:auto}
</style>
<!-- Original artwork for beautiful-py, under the repository's distribution terms.
     Idealized pendulum wave: 24 oscillators complete integer cycles in 60 seconds. -->
<header><h1>摆波星阵</h1><p>二十四颗光摆各循自己的节拍，交织成波，六十秒后重逢。</p><button id="play" type="button">暂停</button></header>
<canvas width="900" height="900" role="img" aria-label="青蓝至金色的光摆在立体空间中交错形成波浪"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,phase=0,last=null;
function point(i,t){
 const angle=.75*Math.cos(2*Math.PI*(20+i)*t/60),z=(i-11.5)*24;
 const x=240*Math.sin(angle),y=240*Math.cos(angle),depth=z*.85-y*.3,k=850/(1050+depth);
 return [450+(x+z*.38)*k,220+(y*.85+z*.48)*k,k];
}
function draw(){
 ctx.globalCompositeOperation='source-over';ctx.fillStyle='#050914';ctx.fillRect(0,0,900,900);
 const bg=ctx.createRadialGradient(450,450,10,450,450,430);bg.addColorStop(0,'#112638');bg.addColorStop(1,'#050914');ctx.fillStyle=bg;ctx.fillRect(0,0,900,900);
 // Draw the farthest pendulums first so nearby beads cover their strings.
 for(let i=23;i>=0;i--){
  const p=point(i,phase),z=(i-11.5)*24,k=850/(1050+z*.85),ax=450+z*.38*k,ay=220+z*.48*k,hue=185-i*6;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(p[0],p[1]);ctx.strokeStyle=`hsla(${hue},75%,75%,.35)`;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#bcd7e7';ctx.beginPath();ctx.arc(ax,ay,2,0,Math.PI*2);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  ctx.beginPath();
  for(let j=0;j<=45;j++){const q=point(i,phase-j*.012);if(j===0)ctx.moveTo(q[0],q[1]);else ctx.lineTo(q[0],q[1]);}
  ctx.strokeStyle=`hsla(${hue},90%,60%,.25)`;ctx.lineWidth=5*p[2];ctx.stroke();
  const r=12*p[2],glow=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],r*3);
  glow.addColorStop(0,`hsla(${hue},100%,70%,.8)`);glow.addColorStop(1,`hsla(${hue},100%,60%,0)`);ctx.fillStyle=glow;ctx.fillRect(p[0]-r*3,p[1]-r*3,r*6,r*6);
  ctx.globalCompositeOperation='source-over';const orb=ctx.createRadialGradient(p[0]-r*.3,p[1]-r*.35,1,p[0],p[1],r);
  orb.addColorStop(0,'#fff');orb.addColorStop(.3,`hsl(${hue},90%,75%)`);orb.addColorStop(1,`hsl(${hue},90%,27%)`);ctx.fillStyle=orb;ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();
 }
}
function frame(now){if(last!==null&&!paused)phase=(phase+Math.min((now-last)/1000,.05))%60;last=now;if(!paused)draw();requestAnimationFrame(frame);}
function label(){play.textContent=paused?'继续':'暂停';play.setAttribute('aria-pressed',String(paused));}
play.addEventListener('click',()=>{paused=!paused;label();});
label();draw();requestAnimationFrame(frame);
</script>
</html>
