<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>极光流体星云 — Interactive Aurora Flow Cosmos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #04050c; overflow: hidden; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .badge { position: fixed; top: 20px; left: 24px; padding: 8px 14px; border-radius: 999px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(99, 102, 241, 0.35); backdrop-filter: blur(8px); color: #e2e8f0; font-size: 13px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="cosmos"></canvas>
  <div class="badge">🌌 移动鼠标牵引流体星云 · 点击触发引力冲击波并变换极光色带</div>
  <script>
    const canvas = document.getElementById("cosmos");
    const ctx = canvas.getContext("2d");
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);
    window.addEventListener("resize", () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      ctx.fillStyle = "#04050c";
      ctx.fillRect(0, 0, w, h);
    });

    let baseHue = 195;
    const pointer = { x: w / 2, y: h / 2, active: false };
    window.addEventListener("pointermove", e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
    window.addEventListener("pointerdown", e => {
      baseHue = (baseHue + 65) % 360;
      for (const p of particles) {
        const dx = p.x - e.clientX, dy = p.y - e.clientY;
        const d = Math.hypot(dx, dy) + 1;
        if (d < 360) {
          const f = (360 - d) / 28;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }
    });

    const COUNT = 1500;
    const particles = Array.from({ length: COUNT }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: 0,
      vy: 0,
      speed: 0.7 + Math.random() * 1.5,
      offset: Math.random() * 45
    }));

    function fieldAngle(x, y, t) {
      const nx = x * 0.0024, ny = y * 0.0024;
      return (Math.sin(nx + t) + Math.cos(ny - t * 0.8) + Math.sin((nx + ny) * 0.7 + t * 0.5)) * Math.PI;
    }

    ctx.fillStyle = "#04050c";
    ctx.fillRect(0, 0, w, h);

    let t = 0;
    function animate() {
      t += 0.0045;
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(4, 5, 12, 0.08)";
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";

      for (const p of particles) {
        const px = p.x, py = p.y;
        const ang = fieldAngle(px, py, t);
        p.vx = p.vx * 0.9 + Math.cos(ang) * p.speed * 0.24;
        p.vy = p.vy * 0.9 + Math.sin(ang) * p.speed * 0.24;

        if (pointer.active) {
          const dx = pointer.x - px, dy = pointer.y - py;
          const dist = Math.hypot(dx, dy);
          if (dist < 240 && dist > 6) {
            p.vx += (dx / dist) * 0.22 - (dy / dist) * 0.18;
            p.vy += (dy / dist) * 0.22 + (dx / dist) * 0.18;
          }
        }

        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          p.x = Math.random() * w;
          p.y = Math.random() * h;
          p.vx = p.vy = 0;
          continue;
        }

        const hue = (baseHue + p.offset + (p.x / w) * 60) % 360;
        ctx.strokeStyle = `hsla(${hue}, 92%, 62%, 0.42)`;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
