<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 流光粒子圣诞树 — 3D Spiral Particle Tree</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: radial-gradient(circle at 50% 25%, #101935 0%, #050712 70%); overflow: hidden; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; color: #f8fafc; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud { position: fixed; left: 24px; bottom: 20px; padding: 10px 16px; border-radius: 999px; background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(148, 163, 184, 0.2); backdrop-filter: blur(10px); font-size: 13px; color: #cbd5e1; user-select: none; cursor: pointer; }
    .hud:hover { border-color: rgba(251, 191, 36, 0.6); color: #fde68a; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hud" id="themeBtn">🎄 拖拽或移动鼠标旋转视角 · 点击此处切换配色主题</div>
  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const THEMES = [
      { name: "鎏金翡翠", hues: [145, 45, 355], star: "#fde047" },
      { name: "赛博霓虹", hues: [190, 285, 325], star: "#67e8f9" },
      { name: "樱粉星河", hues: [335, 350, 45], star: "#fbcfe8" }
    ];
    let themeIdx = 0;
    document.getElementById("themeBtn").addEventListener("click", () => {
      themeIdx = (themeIdx + 1) % THEMES.length;
      buildTree();
    });

    let W = 0, H = 0;
    function resize() {
      W = canvas.width = window.innerWidth * devicePixelRatio;
      H = canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    let particles = [], snow = [];
    function buildTree() {
      const theme = THEMES[themeIdx];
      particles = [];
      const count = 1350;
      for (let i = 0; i < count; i++) {
        const t = i / count;
        const arm = i % 3;
        const angle = t * Math.PI * 22 + (arm * Math.PI * 2) / 3 + (Math.random() - 0.5) * 0.28;
        const radius = Math.pow(t, 0.88) * 195 + (Math.random() - 0.5) * 12;
        const y = -230 + t * 440 + (Math.random() - 0.5) * 8;
        const hue = theme.hues[i % theme.hues.length] + (Math.random() - 0.5) * 14;
        particles.push({
          radius, angle, y,
          size: (1 - t * 0.35) * (Math.random() * 2.3 + 1.1),
          hue,
          light: 55 + Math.random() * 35,
          twinkle: Math.random() * Math.PI * 2
        });
      }
    }
    for (let i = 0; i < 160; i++) {
      snow.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, r: Math.random() * 2.2 + 0.6, v: Math.random() * 0.9 + 0.35, drift: Math.random() * 6.28 });
    }
    buildTree();

    let rotY = 0, targetTilt = 0.12, tilt = 0.12;
    window.addEventListener("pointermove", e => {
      targetTilt = ((e.clientY / window.innerHeight) - 0.5) * 0.55;
      rotY += (e.movementX || 0) * 0.003;
    });

    function drawStar(cx, cy, r, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.shadowBlur = 26;
      ctx.shadowColor = color;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 === 0 ? r : r * 0.42;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    let frame = 0;
    function render() {
      frame++;
      const w = window.innerWidth, h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      // Snowfall
      ctx.fillStyle = "rgba(226, 232, 240, 0.72)";
      for (const s of snow) {
        s.y += s.v;
        s.x += Math.sin(frame * 0.015 + s.drift) * 0.35;
        if (s.y > h) { s.y = -5; s.x = Math.random() * w; }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      rotY += 0.012;
      tilt += (targetTilt - tilt) * 0.06;
      const fov = 560;
      const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
      const projected = [];

      for (const p of particles) {
        const a = p.angle + rotY;
        const x = Math.cos(a) * p.radius;
        const z0 = Math.sin(a) * p.radius;
        const y = p.y * cosT - z0 * sinT;
        const z = p.y * sinT + z0 * cosT + 460;
        const scale = fov / z;
        projected.push({
          sx: w / 2 + x * scale,
          sy: h / 2 + y * scale + 15,
          z,
          r: Math.max(0.7, p.size * scale),
          hue: p.hue,
          light: p.light + Math.sin(frame * 0.08 + p.twinkle) * 14
        });
      }
      projected.sort((a, b) => b.z - a.z);

      ctx.globalCompositeOperation = "lighter";
      for (const p of projected) {
        ctx.fillStyle = `hsla(${p.hue}, 92%, ${p.light}%, 0.86)`;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";

      // Top 3D projected star
      const topY = -242 * cosT;
      const topZ = -242 * sinT + 460;
      const topScale = fov / topZ;
      drawStar(w / 2, h / 2 + topY * topScale + 15, 16 * topScale, THEMES[themeIdx].star);

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
