<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>折纸风阵</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #080e1c; color: #e8f3ff; font: 16px system-ui, sans-serif; }
  header { padding: 1rem 1.25rem; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: .5rem 0; color: #bacbe0; }
  button { font: inherit; color: inherit; padding: .4rem .85rem; background: #152840; border: 1px solid #82a5ca; border-radius: .4rem; cursor: pointer; }
  button:focus-visible { outline: 3px solid #ffe0a0; outline-offset: 3px; }
  canvas { display: block; width: min(100%, 74svh, 850px); height: auto; margin: auto; }
</style>
<header>
  <h1>折纸风阵</h1>
  <p>一排排双色纸片向风倾斜，折面随波依次翻转。</p>
  <button type="button">暂停动画</button>
</header>
<canvas width="900" height="900" role="img" aria-label="一排排双色纸片向风倾斜，折面随波依次翻转。"></canvas>
<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const button = document.querySelector('button');
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
let time = 0;
let previous = null;
let request;
const background = ctx.createRadialGradient(450, 450, 50, 450, 450, 450);
background.addColorStop(0, '#1c2945');
background.addColorStop(1, '#080e1c');

function draw() {
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, 900, 900);
  for (let row = 0; row < 8; row++) {
    for (let column = 0; column < 10; column++) {
      const x = 65 + column * 82 + (row % 2) * 21;
      const y = 126 + row * 91;
      const fold = Math.sin(column * .74 + row * .51 - time * 2.1);
      const crease = x + fold * 17;
      const tips = [[x - 35, y + 29], [x + 33, y + 24]];
      for (const [side, [tipX, tipY]] of tips.entries()) {
        ctx.beginPath();
        ctx.moveTo(x, y - 42);
        ctx.lineTo(crease, y + 34);
        ctx.lineTo(tipX, tipY + fold * (side ? 13 : -13));
        ctx.closePath();
        const hue = side ? 20 + row * 5 : 169 + row * 6;
        const light = side ? 54 + fold * 16 : 54 - fold * 19;
        ctx.fillStyle = `hsl(${hue} 72% ${light}%)`;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(x, y - 42);
      ctx.lineTo(crease, y + 34);
      ctx.strokeStyle = 'rgba(255, 248, 210, .62)';
      ctx.stroke();
    }
  }
}

function frame(now) {
  if (previous !== null) time += Math.min((now - previous) / 1000, .05);
  previous = now;
  draw();
  request = requestAnimationFrame(frame);
}

function updateButton() {
  button.textContent = paused ? '继续动画' : '暂停动画';
}

button.addEventListener('click', () => {
  paused = !paused;
  updateButton();
  if (paused) {
    cancelAnimationFrame(request);
  } else {
    previous = null;
    request = requestAnimationFrame(frame);
  }
});
updateButton();
draw();
if (!paused) request = requestAnimationFrame(frame);
</script>
</html>
