<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环面流光</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#e4f5ff;font:16px system-ui,sans-serif}header{padding:1.2rem 1.4rem}h1{font-size:1.4rem;margin:0}p{color:#a8bdd0;margin:.5rem 0}button{font:inherit;color:inherit;background:#13283b;border:1px solid #7298ac;border-radius:6px;padding:.4rem .9rem;cursor:pointer}button:focus-visible{outline:3px solid #ffe0a0;outline-offset:3px}canvas{display:block;width:min(100%,74svh,850px);aspect-ratio:1;margin:auto}
</style>
<!-- Original artwork for beautiful-py, under the repository's distribution terms. -->
<header><h1>环面流光</h1><p>三绕两回的空间纽结，青金光珠沿着同一条闭合轨道追逐。</p><button id="play" type="button">暂停</button></header>
<canvas width="900" height="900" role="img" aria-label="青蓝与金色粒子构成缓慢旋转的三维环面纽结"></canvas>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,phase=0,last=null;
function point(t,time){
 const r=210+75*Math.cos(3*t),x=r*Math.cos(2*t),y=r*Math.sin(2*t),z=75*Math.sin(3*t),a=time*.16;
 const u=x*Math.cos(a)+z*Math.sin(a),v=-x*Math.sin(a)+z*Math.cos(a),h=y*.65-v*.76,d=y*.76+v*.65,k=850/(1100+d);
 return [450+u*k,450+h*k,k,d];
}
function draw(){
 ctx.globalCompositeOperation='source-over';ctx.fillStyle='#050914';ctx.fillRect(0,0,900,900);
 const bg=ctx.createRadialGradient(450,450,0,450,450,420);bg.addColorStop(0,'#10283c');bg.addColorStop(1,'#050914');ctx.fillStyle=bg;ctx.fillRect(0,0,900,900);
 const beads=[];
 for(let i=0;i<720;i++){
  const t=i/720*Math.PI*2,p=point(t,phase),pulse=Math.pow((1+Math.cos(t*12-phase*2))/2,12);
  beads.push({p,hue:185-140*(1+Math.sin(t*3))/2,pulse});
 }
 beads.sort((a,b)=>b.p[3]-a.p[3]);
 for(const {p,hue,pulse} of beads){
  const r=(1.5+3*pulse)*p[2];
  ctx.globalCompositeOperation='lighter';ctx.fillStyle=`hsla(${hue},95%,65%,${.08+.25*pulse})`;ctx.beginPath();ctx.arc(p[0],p[1],r*3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`hsl(${hue},90%,${55+35*pulse}%)`;ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();
 }
}
function frame(now){if(last!==null&&!paused)phase+=Math.min((now-last)/1000,.05);last=now;if(!paused)draw();requestAnimationFrame(frame);}
function label(){play.textContent=paused?'继续':'暂停';play.setAttribute('aria-pressed',String(paused));}
play.addEventListener('click',()=>{paused=!paused;label();});
label();draw();requestAnimationFrame(frame);
</script>
</html>
